<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: head('Cambiar Contraseña')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/plantilla :: navbar}"></div>
<div class="container" style="max-width: 30rem;">
    <div class="card shadow p-4">
        <h4 class="mb-3">Cambiar Contraseña</h4>
        <div class="alert alert-danger"  th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-success" th:if="${exito}" th:text="${exito}"></div>
        <form th:action="@{/cambio-password}" th:object="${dto}" method="post">
            <div class="mb-3">
                <label class="form-label">Contraseña actual</label>
                <input type="password" class="form-control" th:field="*{passwordActual}">
                <div class="text-danger small" th:errors="*{passwordActual}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Nueva contraseña (mín. 8)</label>
                <input type="password" class="form-control" th:field="*{passwordNueva}">
                <div class="text-danger small" th:errors="*{passwordNueva}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirmar nueva contraseña</label>
                <input type="password" class="form-control" th:field="*{confirmarPasswordNueva}">
            </div>
            <button class="btn btn-primary w-100" type="submit">Actualizar</button>
        </form>
    </div>
</div>
</body>
</html>
