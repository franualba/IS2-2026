<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: head('Nota')}"></head>
<body class="bg-light">
<div th:replace="~{fragments/plantilla :: navbar}"></div>
<div class="container" style="max-width: 30rem;">
    <div class="card shadow p-4">
        <h4 class="mb-3">Cargar Nota</h4>
        <form th:action="@{/notas/guardar}" th:object="${dto}" method="post">
            <input type="hidden" th:field="*{idNota}">
            <div class="mb-3"><label class="form-label">Alumno</label>
                <select class="form-select" th:field="*{alumnoId}">
                    <option value="">--</option>
                    <option th:each="a : ${alumnos}" th:value="${a.idAlumno}"
                            th:text="${a.nombre + ' ' + a.apellido}"></option>
                </select>
                <div class="text-danger small" th:errors="*{alumnoId}"></div></div>
            <div class="mb-3"><label class="form-label">Materia</label>
                <select class="form-select" th:field="*{materiaId}">
                    <option value="">--</option>
                    <option th:each="m : ${materias}" th:value="${m.idMateria}" th:text="${m.nombre}"></option>
                </select>
                <div class="text-danger small" th:errors="*{materiaId}"></div></div>
            <div class="row">
                <div class="col mb-3"><label class="form-label">Fecha</label>
                    <input type="date" class="form-control" th:field="*{fecha}"></div>
                <div class="col mb-3"><label class="form-label">Valor (0-10)</label>
                    <input type="number" step="0.1" class="form-control" th:field="*{valor}">
                    <div class="text-danger small" th:errors="*{valor}"></div></div>
            </div>
            <button class="btn btn-success w-100">Guardar</button>
            <a class="btn btn-secondary w-100 mt-2" th:href="@{/notas}">Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
