<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  FRAGMENTOS REUTILIZABLES (layout).
  sec:authorize / sec:authentication provienen de thymeleaf-extras-springsecurity6:
  permiten mostrar/ocultar menú según el rol y mostrar el usuario logueado.
-->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Sistema de Gestión Escolar</title>
    <!-- Bootstrap 5.3 por CDN (plantilla pública de internet adaptada al proyecto) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/inicio}">🏫 Gestión Escolar</a>
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/alumnos}">Alumnos</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/materias}">Materias</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/notas}">Notas</a></li>
            <!-- Visible SOLO para rol ADMIN (evaluado por Spring Security) -->
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/profesores}">Profesores</a>
            </li>
        </ul>
        <ul class="navbar-nav align-items-center">
            <li class="nav-item"><span class="navbar-text me-2" sec:authentication="name">usuario</span></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/cambio-password}">Cambiar contraseña</a></li>
            <li class="nav-item ms-2">
                <!-- Logout por POST: exigido por la protección CSRF -->
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-light btn-sm" type="submit">Salir</button>
                </form>
            </li>
        </ul>
    </div>
</nav>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
