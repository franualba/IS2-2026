<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">Cambiar contraseña</h4>
                </div>
                <div class="card-body p-4">
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/change-password}" method="post" th:object="${cambioPasswordDTO}">
                        <div class="mb-3">
                            <label class="form-label">Contraseña actual</label>
                            <input type="password" th:field="*{passwordActual}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nueva contraseña</label>
                            <input type="password" th:field="*{nuevaPassword}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Confirmación</label>
                            <input type="password" th:field="*{confirmacion}" class="form-control" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning">Guardar nueva contraseña</button>
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Volver al panel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
