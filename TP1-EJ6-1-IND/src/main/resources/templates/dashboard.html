<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard docente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Sistema Escolar</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white" th:text="${profesor.nombre + ' ' + profesor.apellido}"></span>
            <a th:href="@{/change-password}" class="btn btn-outline-light btn-sm">Cambiar contraseña</a>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row">
        <div class="col-md-12">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h3 class="mb-3">Bienvenido/a</h3>
                    <p><strong>Nombre:</strong> <span th:text="${profesor.nombre}"></span></p>
                    <p><strong>Apellido:</strong> <span th:text="${profesor.apellido}"></span></p>
                    <p><strong>Sexo:</strong> <span th:text="${profesor.sexo}"></span></p>
                    <p><strong>Fecha de Nacimiento:</strong> <span th:text="${#temporals.format(profesor.fechaNacimiento, 'dd/MM/yyyy')}"></span></p>
                    <p><strong>Correo:</strong> <span th:text="${profesor.email}"></span></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
