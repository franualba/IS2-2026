<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar cuota')}" />
<body class="club-bg"><nav class="navbar border-bottom bg-white"><div class="container"><a class="navbar-brand fw-bold text-decoration-none text-dark" th:href="@{/familias}">CLUB / ADMIN</a></div></nav>
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><a class="small text-secondary" th:href="@{/familias}">← Volver a familias</a><h1 class="mt-3 mb-4">Registrar cuota familiar</h1><section class="panel p-4"><form th:action="@{/familias/pagos}" th:object="${pago}" method="post"><input type="hidden" th:field="*{grupoFamiliarId}"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:errors="*{global}"></div><label class="form-label" for="periodo">Período</label><input class="form-control mb-3" id="periodo" type="month" th:field="*{periodo}" required><label class="form-label" for="importe">Importe</label><input class="form-control mb-3" id="importe" type="number" step="0.01" min="0.01" th:field="*{importe}" required><label class="form-label" for="medioPago">Medio de pago</label><select class="form-select mb-4" id="medioPago" th:field="*{medioPago}" required><option value="">Seleccionar...</option><option th:each="medio : ${medios}" th:value="${medio}" th:text="${medio}"></option></select><button class="btn btn-dark" type="submit">Confirmar pago</button></form></section></div></div></main></body></html>
