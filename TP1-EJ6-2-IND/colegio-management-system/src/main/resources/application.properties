# ============================================================================
# CONFIGURACIÓN DE LA APLICACIÓN SPRING BOOT
# ============================================================================
# Este archivo contiene las propiedades de configuración para la aplicación.
# Spring Boot carga automáticamente estas propiedades desde application.properties
# o application.yml en el classpath.
# ============================================================================

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DEL SERVIDOR WEB EMBEBIDO (TOMCAT)
# ----------------------------------------------------------------------------
# Puerto HTTP donde escuchará la aplicación
server.port=8888

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE LA BASE DE DATOS POSTGRESQL
# ----------------------------------------------------------------------------
# URL de conexión JDBC a PostgreSQL
# Formato: jdbc:postgresql://host:port/nombre_base_datos
spring.datasource.url=jdbc:postgresql://localhost:5432/colegio_db

# Credenciales de acceso a la base de datos
spring.datasource.username=postgres
spring.datasource.password=12345

# Driver JDBC para PostgreSQL (se detecta automáticamente, pero se puede especificar)
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE JPA / HIBERNATE (ORM)
# ----------------------------------------------------------------------------
# Dialecto de Hibernate para PostgreSQL
# Define cómo Hibernate genera SQL específico para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Estrategia de generación/esquema de tablas:
# - none: No hace nada (producción)
# - validate: Valida que las tablas existan y coincidan con las entidades
# - update: Actualiza el esquema si hay cambios (desarrollo)
# - create: Crea las tablas al iniciar (borra datos previos)
# - create-drop: Crea al iniciar, elimina al cerrar
spring.jpa.hibernate.ddl-auto=create

# Mostrar SQL generado por Hibernate en consola (útil para debugging)
spring.jpa.show-sql=true

# Formatear SQL mostrado para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE AUDITORÍA DE ENTIDADES
# ----------------------------------------------------------------------------
# Habilita el llenado automático de campos de auditoría (@CreatedBy, @LastModifiedBy, etc.)
# Requiere implementar AuditorAware<T> en la configuración
spring.jpa.properties.hibernate.ejb.interceptor=org.springframework.data.jpa.repository.support.JpaInterceptor

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE SPRING SECURITY
# ----------------------------------------------------------------------------
# Deshabilita la contraseña automática generada por consola al iniciar
# La autenticación se manejará mediante la base de datos y CustomUserDetailsService
spring.security.user.name=admin
spring.security.user.password=admin123

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE CORREO ELECTRÓNICO (JAVA MAIL SENDER)
# ----------------------------------------------------------------------------
# Servidor SMTP para envío de correos (ejemplo con Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tucorreo@gmail.com
spring.mail.password=tupassworddeaplicacion

# Propiedades adicionales para TLS/SSL
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE THYMELEAF (MOTOR DE PLANTILLAS)
# ----------------------------------------------------------------------------
# Prefijo para ubicación de plantillas HTML
spring.thymeleaf.prefix=classpath:/templates/

# Sufijo de archivos de plantilla
spring.thymeleaf.suffix=.html

# Modo de plantilla: HTML5
spring.thymeleaf.mode=HTML

# Codificación de caracteres
spring.thymeleaf.encoding=UTF-8

# Caché de plantillas: false en desarrollo, true en producción
spring.thymeleaf.cache=false

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE LOGGING
# ----------------------------------------------------------------------------
# Nivel de log para la aplicación personalizada
logging.level.com.colegio.gestion=DEBUG

# Nivel de log para Spring Security (útil para debuggear autenticación)
logging.level.org.springframework.security=DEBUG

# Nivel de log para Hibernate SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ----------------------------------------------------------------------------
# CONFIGURACIÓN DE LA APLICACIÓN
# ----------------------------------------------------------------------------
# Nombre de la aplicación
spring.application.name=Colegio Management System

# Perfil activo (dev, test, prod)
spring.profiles.active=dev
