<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Iniciar sesión | Colegio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f3f5f9; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { width: min(420px, 90vw); background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,.08); padding: 32px; }
        h1 { margin-bottom: 24px; text-align: center; }
        .alert { margin-bottom: 16px; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
        .error { background: #fdecea; color: #b42318; }
        .success { background: #ecfdf3; color: #027a48; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 16px; border: 1px solid #d0d5dd; border-radius: 8px; }
        button { width: 100%; background: #1d4ed8; color: white; border: none; border-radius: 8px; padding: 12px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Iniciar sesión</h1>

        <div th:if="${mensajeError != null}" class="alert error" th:text="${mensajeError}"></div>
        <div th:if="${mensajeLogout != null}" class="alert success" th:text="${mensajeLogout}"></div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label for="email">Email</label>
            <input id="email" type="email" name="email" placeholder="usuario@colegio.com" required />

            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" placeholder="Ingrese su contraseña" required />

            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
