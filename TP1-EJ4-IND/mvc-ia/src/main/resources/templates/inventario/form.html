<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Registrar movimiento')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar(esAdmin=false, nombre='')}"></nav>

<div class="container">
    <div class="card shadow-sm" style="max-width: 560px; margin: 0 auto;">
        <div class="card-body p-4">
            <h4 class="mb-4"><i class="bi bi-clipboard-plus"></i> Registrar movimiento de inventario</h4>

            <form th:action="@{/inventario}" th:object="${movimiento}" method="post">
                <div class="mb-3">
                    <label class="form-label">Producto</label>
                    <select class="form-select" name="productoId" required>
                        <option value="" disabled selected>Seleccione un producto</option>
                        <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo de movimiento</label>
                    <select class="form-select" th:field="*{tipoMovimiento}" required>
                        <option value="ENTRADA">ENTRADA (ingreso de stock)</option>
                        <option value="SALIDA">SALIDA (egreso manual de stock)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Cantidad</label>
                    <input type="number" min="1" class="form-control" th:field="*{cantidad}" required/>
                </div>
                <button type="submit" class="btn btn-primary w-100">Guardar movimiento</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
