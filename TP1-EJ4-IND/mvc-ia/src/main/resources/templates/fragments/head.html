<!--
    ============================================================================
    FRAGMENTO THYMELEAF - head.html
    ============================================================================
    Contiene los <meta> y <link> comunes a todas las paginas: charset,
    viewport (para diseno responsive) y la hoja de estilos de Bootstrap 5
    (servida como WebJar desde /webjars/bootstrap/...), mas el CSS propio
    del sistema (static/css/styles.css).

    Se incluye en cada pagina mediante:
        <head th:replace="~{fragments/head :: head(titulo='...')}"></head>
    ============================================================================
-->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${titulo} + ' | Sistema de Gestion'">Sistema de Gestion</title>

    <!-- Bootstrap 5 CSS (via WebJars) -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"/>

    <!-- Iconos Bootstrap (CDN, opcional) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>

    <!-- Estilos propios del sistema -->
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
