<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Formulario de producto')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar(esAdmin=false, nombre='')}"></nav>

<div class="container">
    <div class="card shadow-sm" style="max-width: 560px; margin: 0 auto;">
        <div class="card-body p-4">
            <h4 class="mb-4">
                <i class="bi bi-box-seam"></i>
                <span th:text="${producto.id} == null ? 'Nuevo producto' : 'Editar producto'">Producto</span>
            </h4>

            <form th:action="${producto.id} == null ? @{/productos} : @{/productos/{id}(id=${producto.id})}"
                  th:object="${producto}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="mb-3">
                    <label class="form-label">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Descripcion</label>
                    <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Guardar</button>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
