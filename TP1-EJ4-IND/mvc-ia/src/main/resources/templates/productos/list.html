<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(titulo='Productos')}"></head>
<body>

<nav th:replace="~{fragments/navbar :: navbar(esAdmin=false, nombre='')}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-box-seam"></i> Productos</h3>
        <a th:href="@{/productos/nuevo}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Nuevo producto
        </a>
    </div>

    <div class="table-responsive bg-white rounded shadow-sm p-3">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Descripcion</th>
                <th>Stock actual</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.nombre}">Producto</td>
                <td th:text="${p.descripcion}">Descripcion</td>
                <td>
                    <span class="badge bg-secondary" th:text="${stockPorProducto[p.id]}">0</span>
                </td>
                <td>
                    <a th:href="@{/productos/{id}/editar(id=${p.id})}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-pencil"></i> Editar
                    </a>
                    <form th:action="@{/productos/{id}/eliminar(id=${p.id})}" method="post"
                          style="display:inline" onsubmit="return confirm('¿Eliminar este producto?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="5" class="text-center text-muted">No hay productos cargados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
