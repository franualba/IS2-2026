# =============================================================================
# application.properties
# =============================================================================
# Configuracion central de la aplicacion Spring Boot.
# =============================================================================

# --------------------- Servidor embebido ---------------------
server.port=8080

# --------------------- Datasource MySQL ---------------------
# Reemplazar host/puerto/usuario/clave segun el entorno local.
# La base de datos "gestion_sistema" debe existir previamente
# (o crearla con: CREATE DATABASE gestion_sistema;)
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_sistema?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --------------------- JPA / Hibernate (ORM) ---------------------
# ddl-auto=update: Hibernate crea/actualiza automaticamente las tablas
# en base a las entidades @Entity (util para desarrollo). En un ambiente
# productivo se recomienda usar "validate" + migraciones con Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --------------------- Thymeleaf (Vista) ---------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# --------------------- WebJars (Bootstrap) ---------------------
spring.web.resources.static-locations=classpath:/static/,classpath:/META-INF/resources/

# --------------------- Logging ---------------------
logging.level.org.springframework.web=INFO
logging.level.com.sistema.gestion=DEBUG
