<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container">
        <div th:if="${session.mensajeExito}" class="alert alert-success">
            <span th:text="${session.mensajeExito}"></span>
            <th:block th:text="${session.removeAttribute('mensajeExito')}"></th:block>
        </div>
        <h2 class="mb-4">Lista de Usuarios</h2>
        <table class="table table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}">1</td>
                    <td th:text="${usuario.nombre}">Nombre</td>
                    <td th:text="${usuario.email}">email</td>
                    <td><span th:class="${usuario.rol == 'ADMIN'} ? 'badge bg-danger' : 'badge bg-info'"
                            th:text="${usuario.rol}">ROL</span></td>
                    <td><a th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}" class="btn btn-sm btn-danger"
                            onclick="return confirm('¿Eliminar?');">Eliminar</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="5" class="text-center">No hay usuarios.</td>
                </tr>
            </tbody>
        </table>
        <hr class="my-5">
        <h3 class="mb-3">Agregar Usuario</h3>
        <form th:action="@{/usuarios/guardar}" th:object="${usuarioForm}" method="post" class="row g-3"><input
                type="hidden" th:field="*{id}" />
            <div class="col-md-4"><label class="form-label">Nombre</label><input type="text" class="form-control"
                    th:field="*{nombre}" required></div>
            <div class="col-md-4"><label class="form-label">Email</label><input type="email" class="form-control"
                    th:field="*{email}" required></div>
            <div class="col-md-4"><label class="form-label">Rol</label><select class="form-select" th:field="*{rol}"
                    required>
                    <option value="USER">Usuario</option>
                    <option value="ADMIN">Administrador</option>
                </select></div>
            <div class="col-12"><button type="submit" class="btn btn-primary">Guardar</button></div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
