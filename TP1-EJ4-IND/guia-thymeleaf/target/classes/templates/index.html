<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container">
        <div class="card">
            <div class="card-body">
                <h1 class="card-title" th:text="${mensaje}">Mensaje</h1>
                <p>Curso: <strong th:text="${curso}">Curso</strong></p>
                <a th:href="@{/usuarios/lista}" class="btn btn-success">Ir a Gestión</a>
            </div>
        </div>
    </div>
</body>

</html>
