<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Detalle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container">
        <div th:if="${usuario != null}" class="card">
            <div class="card-body">
                <h5 th:text="${usuario.nombre}">Nombre</h5>
                <p><strong>ID:</strong> <span th:text="${usuario.id}"></span></p>
                <p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
                <a th:href="@{/usuarios/lista}" class="btn btn-secondary">Volver</a>
            </div>
        </div>
        <div th:if="${usuario == null}" class="alert alert-warning">No se encontró el usuario. <a
                th:href="@{/usuarios/lista}">Volver</a></div>
    </div>
</body>

</html>
